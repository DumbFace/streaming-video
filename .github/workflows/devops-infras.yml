# .github/workflows/devops-infras.yml
name: Deploy Infrastructure

run-name: "Deploy Infrastructure - ${{ inputs.stage }} - SHA: ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "SST stage to deploy"
        required: true
        default: stage
        type: choice
        options:
          - stage
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.stage == 'stage' && 'stage' || 'production' }}

    defaults:
      run:
        working-directory: shared

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm --filter shared i

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy with SST
        env:
          CLOUDAMQP_API_KEY: ${{ secrets.CLOUDAMQP_API_KEY }}
          ATLAS_PUBLIC_KEY: ${{ vars.ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.ATLAS_PRIVATE_KEY }}
          ATLAS_ORG_ID: ${{ secrets.ATLAS_ORG_ID }}
          UPSTASH_EMAIL: ${{ vars.UPSTASH_EMAIL }}
          UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}

          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFRONT_PRIVATE_KEY: ${{ secrets.CLOUDFRONT_PRIVATE_KEY }}

        run: pnpm exec sst deploy --stage ${{ inputs.stage }}
