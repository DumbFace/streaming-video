# 1. Định nghĩa cụm server Node.js (Upstream) để dễ quản lý
upstream nextjs_upstream {
    server 127.0.0.1:3000; # Cổng port mà bạn chạy `node server.js`
    keepalive 64;
}

# 2. Cấu hình Server block chính
server {
    listen 80;
    server_name kangfarmfun-Modern-14-B11MOU; # Thay bằng domain hoặc IP VPS của bạn

    # Tối ưu hóa việc truyền tải file tầng Kernel
    sendfile on;
    tcp_nopush on;
    
    # Bật nén Gzip để tải trang/JS/CSS nhanh hơn
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # -----------------------------------------------------------------
    # CẤU HÌNH FILE TĨNH (STATIC & PUBLIC) - ĐỂ CỰC KỲ NHANH VÀ GIẢM TẢI NODEJS
    # -----------------------------------------------------------------

    # Phục vụ đống file chunk JS/CSS hệ thống sinh ra trong .next/static
    location /_next/static/ {
        alias /var/www/streaming-video/fe/.next/static/;
        expires 365d;          # Cho phép trình duyệt lưu cache 1 năm vì tên file là hash, không sợ trùng
        access_log off;        # Tắt log để đỡ rác ổ cứng server
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Phục vụ hình ảnh, video tĩnh, favicon nằm trong thư mục public
    location /public/ {
        alias /var/www/streaming-video/fe/public/;
        expires 30d;           # Cache 30 ngày cho các file tĩnh tự upload
        access_log off;
        add_header Cache-Control "public, max-age=2592000, must-revalidate";
    }

    # -----------------------------------------------------------------
    # CẤU HÌNH ĐẨY REQUEST VỀ NODE.JS SERVER (LOGIC & RENDER HTML)
    # -----------------------------------------------------------------
    location / {
        # Đẩy request về phía Node.js đang chạy ngầm
        proxy_pass http://localhost:3000;
        
        # Thiết lập các Header chuẩn để truyền thông tin client về Node.js (rất quan trọng cho Auth.js)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tăng timeout nếu bạn có các tác vụ upload video lớn (10GB như file config của bạn)
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        client_max_body_size  10g; # Phải khớp với bodySizeLimit trong next.config.ts của bạn
    }
}